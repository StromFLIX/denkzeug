[package]
name = "denkzeug-docker-broker-spike"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
publish = false

[dependencies]
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std"] }
form_urlencoded = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
flate2 = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
opentelemetry = "0.31"
opentelemetry_sdk = "0.31"
opentelemetry-otlp = { version = "0.31", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace", "metrics", "logs"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "stream", "blocking"] }
rustix = { version = "1", features = ["fs", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tar = { version = "0.4", default-features = false }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "io-util", "sync", "fs", "process", "signal"] }
tokio-util = { version = "0.7", features = ["io"] }

[dev-dependencies]
opentelemetry-proto = { version = "0.31", default-features = false, features = ["gen-tonic-messages", "trace", "metrics", "logs"] }
prost = "0.14"
rcgen = "0.14"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio = { version = "1", features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }

[profile.dev]
debug = 0

[profile.test]
debug = 0

[profile.release]
strip = true
lto = "thin"
